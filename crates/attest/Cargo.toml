[package]
name = "passport-attest"
description = "Passport claim proofs: claim vocabulary, Groth16 proving over passport_claim, the compact claim-proof format, OpenID4VP"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
passport-driver-emrtd = { workspace = true, features = ["std"] }
passport-pki = { workspace = true }
passport-prover = { workspace = true }
xark-prover = { workspace = true }
xark-ir = { workspace = true }
xark-backend = { workspace = true }
ark-bn254 = "0.6"
ark-ff = "0.6"
ark-ec = "0.6"
ark-groth16 = "0.6"
ark-serialize = "0.6"
ark-snark = "0.6"
rand = "0.8"
sha2 = "0.10"
base64 = "0.22"
serde_json = { workspace = true }
thiserror = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
# The reference Poseidon (circomlib parameters, Solana's `sol_poseidon`); on
# its own arkworks version, compared through decimal strings.
light-poseidon = "0.4"
ark-bn254-05 = { package = "ark-bn254", version = "0.5" }
passport-pki = { workspace = true, features = ["fixtures"] }
ark-ff-05 = { package = "ark-ff", version = "0.5" }
