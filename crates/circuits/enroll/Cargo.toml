[package]
name = "passport_enroll"
description = "Circuit: a genuine, live passport (SOD under a trusted DSC, DG1 and DG15 bound by it, Active Authentication) enrolled as a commitment"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
xark = { workspace = true }
passport-gadget-poseidon = { workspace = true }
passport-gadget-rsa = { workspace = true }
passport-gadget-lds = { workspace = true }

# Host-only: the native validator the `#[circuit]` macro generates for tests.
[target.'cfg(not(xark))'.dependencies]
xark-prover = { workspace = true }

[dev-dependencies]
passport-attest = { workspace = true }
passport-pki = { workspace = true, features = ["fixtures"] }
