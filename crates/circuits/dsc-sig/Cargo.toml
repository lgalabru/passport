[package]
name = "passport_dsc_sig"
description = "Circuit: RSA-1024 PKCS#1 v1.5 / SHA-256 signature, the Document Signer signature shape"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
xark = { workspace = true }
passport-gadget-rsa = { workspace = true }

# Host-only: the native validator the `#[circuit]` macro generates for tests.
[target.'cfg(not(xark))'.dependencies]
xark-prover = { workspace = true }

[dev-dependencies]
rsa = { version = "0.9", features = ["sha2"] }
sha2 = "0.10"
num-bigint = "0.4"
rand_core = "0.6"
