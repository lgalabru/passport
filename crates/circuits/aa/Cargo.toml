[package]
name = "passport_aa"
description = "Circuit: ICAO Active Authentication, RSA-1024 ISO/IEC 9796-2 scheme 1 with SHA-1 over an 8-byte challenge"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
xark = { workspace = true }
passport-gadget-rsa = { workspace = true }

# Host-only: the native validator the `#[circuit]` macro generates for tests, and
# the reference vector (an `rsa`-crate key, a chip-style ISO 9796-2 signature)
# shared by the tests and the `inputs` example that feeds `xark prove`.
[target.'cfg(not(xark))'.dependencies]
xark-prover = { workspace = true }
rsa = { version = "0.9", features = ["sha2"] }
sha1 = "0.10"
num-bigint = "0.4"
rand_core = "0.6"
