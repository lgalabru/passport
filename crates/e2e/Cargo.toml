[package]
name = "passport-e2e"
description = "End-to-end tests on an in-process surfpool (surfpool-sdk): the AA verifier, and the registry with a real enrollment and a claim proof checked against its root"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dev-dependencies]
passport-aa-verifier = { path = "../programs/aa-verifier" }
passport-registry = { path = "../programs/registry" }
passport-attest = { workspace = true }
passport-pki = { workspace = true, features = ["fixtures"] }
rand = "0.8"
# The surfnet runs inside the test process. Keypair, Pubkey, Signer and RpcClient
# come from its re-exports so the Solana crate versions line up with its RPC client.
surfpool-sdk = "1.6"
solana-transaction = "4"
solana-instruction = "3"
solana-signature = "3"
solana-commitment-config = "3"
solana-compute-budget-interface = "3"
solana-transaction-status-client-types = "4"
# Custom surfnet cheatcodes over RPC (setting the program upgrade authority).
solana-rpc-client-api = "4"
serde_json = { workspace = true }
tokio = { workspace = true }
