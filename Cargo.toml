[workspace]
resolver = "3"
members = [
    "crates/circuits/aa",
    "crates/circuits/claim",
    "crates/circuits/dsc-sig",
    "crates/circuits/enroll",
    "crates/circuits/rsa2048",
    "crates/circuits/gadgets/lds",
    "crates/circuits/gadgets/poseidon",
    "crates/circuits/gadgets/rsa",
    "crates/circuits/gadgets/sha1",
    "crates/circuits/sha1",
    "crates/pki",
    "crates/attest",
    "crates/cli",
    "crates/core",
    "crates/document",
    "crates/e2e",
    "crates/drivers/*",
    "crates/ffi",
    "clients/flipper",
    "crates/integration",
    "crates/mcp",
    "crates/programs/aa-verifier",
    "crates/types",
]
default-members = ["crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/lgalabru/passport"
authors = ["Ludovic Galabru <ludo.galabru@solana.org>"]
rust-version = "1.88"

[workspace.dependencies]
passport-types = { version = "0.1.0", path = "crates/types" }
passport-core = { version = "0.1.0", path = "crates/core" }
passport-mcp = { version = "0.1.0", path = "crates/mcp" }
passport-document = { version = "0.1.0", path = "crates/document", default-features = false }
passport-attest = { version = "0.1.0", path = "crates/attest" }
passport-driver-emrtd = { version = "0.1.0", path = "crates/drivers/emrtd", default-features = false }
passport-gadget-sha1 = { version = "0.1.0", path = "crates/circuits/gadgets/sha1" }
passport-pki = { version = "0.1.0", path = "crates/pki" }
passport-gadget-lds = { version = "0.1.0", path = "crates/circuits/gadgets/lds" }
xark-sha256 = { git = "https://github.com/blueshift-gg/xark", rev = "74817fa" }
passport-gadget-poseidon = { version = "0.1.0", path = "crates/circuits/gadgets/poseidon" }
passport-gadget-rsa = { version = "0.1.0", path = "crates/circuits/gadgets/rsa" }
# xark: Rust circuits -> Groth16 (BN254) -> Solana verifier. Pinned to the commit the
# installed `xark` / `xark-rustc` binaries were built from (see README, Circuits).
xark = { git = "https://github.com/blueshift-gg/xark", rev = "74817fa", default-features = false }
xark-bits = { git = "https://github.com/blueshift-gg/xark", rev = "74817fa" }
xark-bignum = { git = "https://github.com/blueshift-gg/xark", rev = "74817fa" }
xark-prover = { git = "https://github.com/blueshift-gg/xark", rev = "74817fa" }
xark-verifier = { git = "https://github.com/blueshift-gg/xark", rev = "74817fa" }
xark-ir = { git = "https://github.com/blueshift-gg/xark", rev = "74817fa" }
xark-backend = { git = "https://github.com/blueshift-gg/xark", rev = "74817fa" }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
yaml_serde = "0.10"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
console = "0.16"
indicatif = "0.18"
dirs = "6"
# USB serial link to the Flipper (no libudev: port names are enough)
serialport = { version = "4", default-features = false }
rmcp = { version = "3.5", features = ["server", "transport-io", "schemars"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3"
# no_std crypto for the eMRTD reader (used with default features off)
des = { version = "0.9", default-features = false }
sha1 = { version = "0.11", default-features = false }
# Flipper Zero (SDK API 87.1). Only built for `thumbv7em-none-eabihf`.
flipperzero = { version = "0.16", default-features = false, features = ["alloc"] }
flipperzero-sys = "0.16"
flipperzero-rt = "0.16"
flipperzero-alloc = "0.16"

[workspace.lints.clippy]
all = "warn"

[workspace.lints.rust]
# `cfg(xark)` is set by the xark compiler when it lowers a circuit crate.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(xark)', 'cfg(target_os, values("solana"))'] }

# Flipper Zero: STM32WB55, 256 KB RAM, 2 KB app stack. Optimise for size and
# never unwind into the firmware. A separate profile so the CLI's `release`
# build is unaffected: `cargo build --profile flipper --target thumbv7em-none-eabihf`.
[profile.flipper]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
overflow-checks = false

# RSA key generation and big-integer arithmetic are unusably slow unoptimized;
# the test PKI generates 2048-bit keys in every debug test run.
[profile.dev.package.num-bigint-dig]
opt-level = 3
[profile.dev.package.num-bigint]
opt-level = 3
[profile.dev.package.rsa]
opt-level = 3

# RSA-2048 needs 24 bignum limbs; upstream caps at 16 until
# upstream lifts it; the fork's `passport` branch is 74817fa plus that and
# a public sha256 `compress`, so the installed xark-rustc (74817fa) matches.
[patch."https://github.com/blueshift-gg/xark"]
xark = { git = "https://github.com/lgalabru/xark", rev = "0a73e7c" }
xark-bits = { git = "https://github.com/lgalabru/xark", rev = "0a73e7c" }
xark-bignum = { git = "https://github.com/lgalabru/xark", rev = "0a73e7c" }
xark-prover = { git = "https://github.com/lgalabru/xark", rev = "0a73e7c" }
xark-verifier = { git = "https://github.com/lgalabru/xark", rev = "0a73e7c" }
xark-ir = { git = "https://github.com/lgalabru/xark", rev = "0a73e7c" }
xark-backend = { git = "https://github.com/lgalabru/xark", rev = "0a73e7c" }
xark-macros = { git = "https://github.com/lgalabru/xark", rev = "0a73e7c" }
xark-sha256 = { git = "https://github.com/lgalabru/xark", rev = "0a73e7c" }
